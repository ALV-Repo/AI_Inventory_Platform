name: CI/CD Pipeline

# Release gates per SRS §13: tests, cross-tenant isolation, security scan,
# migration check — all must pass before an image is published or deployed.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------ backend
  backend:
    name: Backend — lint, test, coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Unit and integration tests (>=70% coverage, NFR-14)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://stockflow:stockflow@localhost:5432/stockflow_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-not-used-in-production
        run: pytest

      - name: Cross-tenant isolation gate (NFR-01)
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-not-used-in-production
        run: pytest tests/test_isolation.py -q --no-cov

      - name: Verify migrations apply cleanly
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://stockflow:stockflow@localhost:5432/stockflow_test
        run: alembic upgrade head && alembic check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore

  # ----------------------------------------------------------------- frontend
  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm ci once package-lock.json is committed (do this on first install);
        # fall back to npm install so a fresh clone still builds.
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ----------------------------------------------------------------- security
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: npm audit
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "No package-lock.json yet - commit one to enable npm audit."
          fi

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy.sarif

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------- build
  publish:
    name: Build and push images
    needs: [backend, frontend, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ staging
  deploy-staging:
    name: Deploy to staging
    needs: publish
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.stockflow.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Configure cluster access
        run: echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube-config"

      - name: Apply manifests and roll out
        env:
          KUBECONFIG: /home/runner/.kube-config
        run: |
          kubectl apply -f deploy/k8s/ -n stockflow-staging
          kubectl set image deployment/stockflow-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }} \
            -n stockflow-staging
          kubectl set image deployment/stockflow-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }} \
            -n stockflow-staging
          kubectl rollout status deployment/stockflow-backend -n stockflow-staging --timeout=5m

      - name: Smoke test
        run: curl -fsS https://staging.stockflow.example.com/health

  # --------------------------------------------------------------- production
  deploy-production:
    name: Deploy to production
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production           # requires manual approval in repo settings
      url: https://app.stockflow.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Configure cluster access
        run: echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube-config"

      - name: Run database migrations
        env:
          KUBECONFIG: /home/runner/.kube-config
        run: |
          kubectl run migrate-${{ github.run_id }} \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }} \
            --restart=Never --rm -i -n stockflow-prod \
            --env="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --command -- alembic upgrade head

      - name: Canary rollout
        env:
          KUBECONFIG: /home/runner/.kube-config
        run: |
          kubectl set image deployment/stockflow-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }} \
            -n stockflow-prod
          kubectl rollout status deployment/stockflow-backend -n stockflow-prod --timeout=10m
          kubectl set image deployment/stockflow-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }} \
            -n stockflow-prod
          kubectl rollout status deployment/stockflow-frontend -n stockflow-prod --timeout=10m

      - name: Smoke test
        run: curl -fsS https://app.stockflow.example.com/health

      - name: Roll back on failure
        if: failure()
        env:
          KUBECONFIG: /home/runner/.kube-config
        run: |
          kubectl rollout undo deployment/stockflow-backend -n stockflow-prod
          kubectl rollout undo deployment/stockflow-frontend -n stockflow-prod
