# Scheduled AI batch jobs (FR-AI-FOR-03: forecasts retrain on a schedule)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stockflow-forecast-refresh
spec:
  schedule: "0 2 * * *"            # 02:00 daily
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: forecast
              image: ghcr.io/ailead/stockflow/backend:latest
              command: ["python", "-m", "app.services.jobs", "refresh_forecasts"]
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: stockflow-secrets, key: database-url } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stockflow-db-backup
spec:
  schedule: "0 1 * * *"            # NFR-06: daily encrypted backup, RPO <= 24h
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - pg_dump "$DATABASE_URL" | gzip > /backup/stockflow-$(date +%F).sql.gz
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: stockflow-secrets, key: database-url-raw } }
              volumeMounts: [{ name: backup, mountPath: /backup }]
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: stockflow-backups }
