apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockflow-backend
  labels: { app: stockflow, component: backend }
spec:
  replicas: 3                      # NFR-03: stateless, horizontally scalable
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # zero-downtime (NFR-04)
  selector:
    matchLabels: { app: stockflow, component: backend }
  template:
    metadata:
      labels: { app: stockflow, component: backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: ghcr.io/ailead/stockflow/backend:latest
          ports: [{ containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: stockflow-secrets, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: stockflow-secrets, key: redis-url } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: stockflow-secrets, key: jwt-secret } }
            - name: AI_API_KEY
              valueFrom: { secretKeyRef: { name: stockflow-secrets, key: ai-api-key } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: stockflow-backend
spec:
  selector: { app: stockflow, component: backend }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockflow-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stockflow-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
