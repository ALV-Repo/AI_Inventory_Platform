apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockflow-frontend
  labels: { app: stockflow, component: frontend }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: stockflow, component: frontend }
  template:
    metadata:
      labels: { app: stockflow, component: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ailead/stockflow/frontend:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.stockflow.example.com/api/v1
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stockflow-frontend
spec:
  selector: { app: stockflow, component: frontend }
  ports: [{ port: 80, targetPort: 3000 }]
